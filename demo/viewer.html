<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage viewer</title>
<style>
  :root { --bg: #0e0f12; --card: #181a1f; --line: #2a2d34; --text: #eceef2; --mute: #8b909b; --accent: #3b82f6; --red: #ef4444; --green: #22c55e; --amber: #f59e0b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .hidden { display: none !important; }
  button { font: inherit; border: 0; border-radius: 8px; background: var(--accent); color: #fff; padding: 10px 14px; cursor: pointer; }
  button.grey, button.off { background: #3a3d45; }
  button.danger { background: #7f1d1d; }
  button:disabled { opacity: .6; cursor: default; }
  input[type=email], input[type=password], input[type=text] { width: 100%; padding: 11px; font-size: 16px; margin-bottom: 8px; border-radius: 8px; border: 1px solid var(--line); background: #111318; color: var(--text); }
  input[type=range] { width: 100%; }
  select { width: 100%; padding: 11px; font-size: 16px; border-radius: 8px; border: 1px solid var(--line); background: #111318; color: var(--text); }
  .hint { font-size: 12px; color: var(--mute); margin: 6px 0; }
  .err { color: var(--red); font-size: 14px; min-height: 18px; }

  .authwrap { max-width: 380px; margin: 0 auto; padding: 24px 16px; }

  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .brand { font-weight: 600; letter-spacing: .3px; }
  .who { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mute); }
  .who span { max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.icon { background: transparent; color: var(--text); padding: 7px; border-radius: 50%; line-height: 0; }
  button.icon:hover { background: #23262d; }
  button.icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  main { max-width: 880px; margin: 0 auto; padding: 14px 16px 40px; }
  .err.top { margin-bottom: 8px; }

  .hero { position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; margin-bottom: 16px; border: 1px solid var(--line); }
  .hero img, .hero video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
  .hero .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--mute); font-size: 14px; text-align: center; padding: 20px; }
  .pill { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.6); padding: 5px 11px; border-radius: 999px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mute); }
  .pill.armed::before { background: var(--red); }
  .pill.online::before { background: var(--green); }
  .pill.warn::before { background: var(--amber); }
  .pill.live::before { background: var(--red); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .gear { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.6); color: #fff; }
  .gear:hover { background: rgba(0,0,0,.8); }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 14px 12px; background: linear-gradient(transparent, rgba(0,0,0,.75)); display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .foot b { display: block; font-size: 17px; }
  .foot small { color: #c4c8d0; font-size: 12px; }
  .foot button { background: rgba(255,255,255,.18); padding: 8px 12px; white-space: nowrap; }

  h2 { font-size: 15px; font-weight: 600; margin: 22px 0 10px; color: var(--mute); text-transform: uppercase; letter-spacing: .6px; }
  .sechead { display: flex; justify-content: space-between; align-items: flex-end; }
  button.small { padding: 6px 10px; font-size: 13px; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .thumb { padding: 0; background: var(--card); border: 1px solid var(--line); text-align: left; overflow: hidden; border-radius: 10px; }
  .thumb img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #000; }
  .thumb span { display: block; padding: 6px 8px; font-size: 12px; color: var(--mute); }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet { background: var(--card); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 14px 16px 22px; }
  @media (min-width: 640px) { .modal { align-items: center; } .sheet { border-radius: 16px; } }
  .sheethead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .sheethead b { font-size: 17px; }
  .setting { margin: 14px 0; }
  .setting label { display: block; font-size: 13px; color: var(--mute); margin-bottom: 4px; }
  .bar2 { background: #2a2d34; height: 10px; border-radius: 5px; position: relative; overflow: hidden; }
  .meter { background: var(--amber); height: 10px; width: 0; transition: width .3s; }
  .mark { position: absolute; left: 33.3%; top: 0; width: 2px; height: 10px; background: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .code { font-size: 24px; letter-spacing: 2px; margin: 12px 0; word-break: break-all; user-select: all; }
  .big { width: 100%; border-radius: 10px; display: block; margin-bottom: 10px; background: #000; }
</style>
</head>
<body>

<div id="authWrap" class="authwrap hidden">
  <h1>Garage</h1>
  <div id="authBox"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">Garage</div>
    <div class="who">
      <span id="who"></span>
      <button class="icon" id="addCamBtn" title="Add a camera"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><path d="M12 10.5v5M9.5 13h5"/></svg></button>
      <button class="icon" id="inviteBtn" title="Invite someone"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M19 8v6M16 11h6"/></svg></button>
      <button class="icon" id="logoutBtn" title="Log out"><svg viewBox="0 0 24 24"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5"/><path d="M15 8l4 4-4 4M19 12H9"/></svg></button>
    </div>
  </header>
  <main>
    <div class="err top" id="err"></div>
    <div id="cams"></div>
    <div class="sechead"><h2>Recent activity</h2><button id="delAll" class="grey small">Delete all photos</button></div>
    <div id="grid" class="grid"></div>
    <div class="hint" style="margin-top:24px">Version 20261023i</div>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <div class="sheethead"><b id="mTitle"></b><button class="icon" id="mClose" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="mBody"></div>
  </div>
</div>

<script src="config.js?v=20261023i"></script>
<script src="sb.js?v=20261023i"></script>
<script src="auth.js?v=20261023i"></script>
<script>
(function () {
  var sb = makeSb('garage_viewer_session');
  var $ = function (id) { return document.getElementById(id); };

  var camById = {};          // camera id -> latest row from the server
  var camOrder = '';
  var cards = {};            // camera id -> card elements
  var events = [];
  var urls = {};             // photo path -> signed url
  var lives = {};            // camera id -> running live view
  var prevSnap = {};
  var prevSeen = {};
  var modalState = null;     // { update(cam) } while a camera settings modal is open
  var LIVE_MAX_MS = 10 * 60 * 1000;
  var LIVE_FRAME_MS = 150;
  var ONLINE_MS = 30000;

  // ---------- small helpers ----------
  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text != null) { e.textContent = text; }
    return e;
  }
  function when(iso) { return new Date(iso).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  function showErr(e) {
    $('err').textContent = e && e.message ? e.message : '';
    if (!sb.loggedIn()) { show(false); auth.show(); }
  }
  function save(id, patch) {
    var c = camById[id];
    if (c) { for (var k in patch) { c[k] = patch[k]; } }
    return sb.updateCamera(id, patch).catch(showErr);
  }
  function isOnline(c) { return c.pinged_at && (Date.now() - new Date(c.pinged_at).getTime()) < ONLINE_MS; }

  function show(loggedIn) {
    $('authWrap').className = 'authwrap' + (loggedIn ? ' hidden' : '');
    $('app').className = loggedIn ? '' : 'hidden';
  }

  // ---------- modal ----------
  function openModal(title, body, state) {
    $('mTitle').textContent = title;
    var box = $('mBody');
    box.innerHTML = '';
    box.appendChild(body);
    modalState = state || null;
    $('modal').className = 'modal';
  }
  function closeModal() { $('modal').className = 'modal hidden'; modalState = null; }
  $('mClose').onclick = closeModal;
  $('modal').onclick = function (e) { if (e.target === $('modal')) { closeModal(); } };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeModal(); } });

  // ---------- camera cards ----------
  function status(c) {
    if (lives[c.id]) { return { text: 'Live', cls: 'live' }; }
    if (!c.pinged_at) { return { text: 'Not connected yet', cls: 'warn' }; }
    if (!isOnline(c)) { return { text: 'Offline', cls: 'warn' }; }
    return c.armed ? { text: 'Armed', cls: 'armed' } : { text: 'Online, not armed', cls: 'online' };
  }

  function latestEvent(camId) {
    for (var i = 0; i < events.length; i++) { if (events[i].camera_id === camId) { return events[i]; } }
    return null;
  }

  function buildCard(c) {
    var hero = h('div', 'hero');
    var vid = h('video', 'hidden'); vid.autoplay = true; vid.muted = true; vid.setAttribute('playsinline', '');
    var img = h('img'); img.alt = ''; img.className = 'hidden';
    var empty = h('div', 'empty', 'No photo yet');
    var pill = h('div', 'pill');
    var gear = h('button', 'icon gear');
    gear.title = 'Settings';
    gear.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
    var foot = h('div', 'foot');
    var info = h('div');
    var name = h('b', '', c.name);
    var sub = h('small');
    info.appendChild(name); info.appendChild(sub);
    var liveBtn = h('button', '', 'Live');
    foot.appendChild(info); foot.appendChild(liveBtn);
    hero.appendChild(vid); hero.appendChild(img); hero.appendChild(empty); hero.appendChild(pill); hero.appendChild(gear); hero.appendChild(foot);

    var p = { root: hero, vid: vid, img: img, empty: empty, pill: pill, name: name, sub: sub, liveBtn: liveBtn, shownPath: null };
    cards[c.id] = p;
    gear.onclick = function () { openSettings(c.id); };
    liveBtn.onclick = function () { if (lives[c.id]) { stopLive(c.id); } else { startLive(c.id); } };
    return hero;
  }

  function updateCard(c) {
    var p = cards[c.id];
    if (!p) { return; }
    var st = status(c);
    p.pill.textContent = st.text;
    p.pill.className = 'pill ' + st.cls;
    p.name.textContent = c.name;
    var ev = latestEvent(c.id);
    var online = isOnline(c);
    p.sub.textContent = ev ? 'Last photo ' + when(ev.created_at) : (online ? 'Waiting for the first motion' : (c.pinged_at ? 'Last seen ' + when(c.pinged_at) : ''));
    p.liveBtn.textContent = lives[c.id] ? 'Stop' : 'Live';
    if (lives[c.id]) { return; }              // the live view owns the picture
    var path = ev ? ev.photo_path : null;
    if (path !== p.shownPath) {
      p.shownPath = path;
      if (path && urls[path]) {
        p.img.src = urls[path];
        p.img.className = '';
        p.empty.className = 'hidden';
      } else {
        p.img.className = 'hidden';
        p.empty.textContent = 'No photo yet';
        p.empty.className = 'empty';
      }
    }
  }

  function renderCams(list) {
    var order = list.map(function (c) { return c.id; }).join(',');
    list.forEach(function (c) { camById[c.id] = c; });
    var box = $('cams');
    if (order !== camOrder) {
      Object.keys(lives).forEach(function (id) { stopLive(id); });
      camOrder = order;
      cards = {};
      box.innerHTML = '';
      if (!list.length) {
        var none = h('div', 'hero');
        var e = h('div', 'empty');
        e.appendChild(document.createTextNode('No camera yet. Tap the camera icon at the top to add one.'));
        none.appendChild(e);
        box.appendChild(none);
      }
      list.forEach(function (c) { box.appendChild(buildCard(c)); });
    }
    list.forEach(function (c) {
      // A new photo from this camera: show it now instead of waiting for the next periodic refresh.
      if (prevSeen[c.id] !== undefined && c.last_seen !== prevSeen[c.id]) { loadEvents(); }
      prevSeen[c.id] = c.last_seen;
      var wasSnap = prevSnap[c.id];
      prevSnap[c.id] = c.snapshot_requested;
      updateCard(c);
      if (wasSnap && !c.snapshot_requested) { loadEvents(); }   // the requested photo has arrived
    });
    if (modalState && modalState.update) { modalState.update(camById[modalState.id]); }
  }

  function loadCams() {
    return sb.listCameras().then(function (list) {
      if (!Object.keys(lives).length) { $('err').textContent = ''; }
      renderCams(list);
    }).catch(showErr);
  }

  // ---------- recent activity ----------
  function renderGrid() {
    var g = $('grid');
    g.innerHTML = '';
    if (!events.length) { g.appendChild(h('div', 'hint', 'No photos yet.')); return; }
    events.forEach(function (e) {
      var b = h('button', 'thumb');
      var im = h('img'); im.alt = ''; im.loading = 'lazy';
      if (urls[e.photo_path]) { im.src = urls[e.photo_path]; }
      var cam = camById[e.camera_id];
      var kind = e.kind === 'motion' ? '' : ' (' + e.kind + ')';
      b.appendChild(im);
      b.appendChild(h('span', '', when(e.created_at) + kind + (cam ? ' - ' + cam.name : '')));
      b.onclick = function () { openPhoto(e); };
      g.appendChild(b);
    });
  }

  function openPhoto(e) {
    var body = h('div');
    var im = h('img', 'big'); im.src = urls[e.photo_path] || '';
    body.appendChild(im);
    var cam = camById[e.camera_id];
    body.appendChild(h('div', 'hint', when(e.created_at) + (cam ? ' - ' + cam.name : '') + (e.kind !== 'motion' ? ' (' + e.kind + ')' : '')));
    var del = h('button', 'danger', 'Delete photo');
    del.onclick = function () {
      if (!confirm('Delete this photo?')) { return; }
      sb.deleteEvent(e.id, e.photo_path).then(function () { closeModal(); loadEvents(); }).catch(showErr);
    };
    var row = h('div', 'row'); row.appendChild(del); body.appendChild(row);
    openModal('Photo', body);
  }

  function loadEvents() {
    return sb.listEvents(60).then(function (list) {
      return sb.signPaths(list.map(function (e) { return e.photo_path; })).then(function (map) {
        events = list;
        urls = map;
        renderGrid();
        Object.keys(camById).forEach(function (id) { updateCard(camById[id]); });
      });
    }).catch(showErr);
  }

  $('delAll').onclick = function () {
    if (!events.length) { showErr(new Error('There are no photos to delete.')); return; }
    if (!confirm('Delete ALL photos from all cameras? This cannot be undone.')) { return; }
    var btn = $('delAll');
    btn.disabled = true;
    btn.textContent = 'Deleting...';
    sb.deleteAllPhotos().then(function () { return loadEvents(); }).catch(showErr).then(function () {
      btn.disabled = false;
      btn.textContent = 'Delete all photos';
    });
  };

  // ---------- live view ----------
  // First choice: real video (WebRTC, direct link camera <-> this page, signalling through the cameras table).
  // Fallback: the camera sends a small picture every moment while this runs.
  var ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
  var RTC_WAIT_MS = 20000;

  function waitIce(pc) {
    return new Promise(function (resolve) {
      if (pc.iceGatheringState === 'complete') { resolve(); return; }
      var done = false;
      function fin() { if (!done) { done = true; resolve(); } }
      pc.onicegatheringstatechange = function () { if (pc.iceGatheringState === 'complete') { fin(); } };
      setTimeout(fin, 3500);
    });
  }

  function stopLive(id, msg) {
    var l = lives[id];
    if (!l) { return; }
    clearInterval(l.keep);
    clearInterval(l.poll);
    clearTimeout(l.timer);
    clearTimeout(l.fallbackTimer);
    clearTimeout(l.maxTimer);
    if (l.pc) { try { l.pc.close(); } catch (e) {} }
    delete lives[id];
    var p = cards[id];
    if (p) {
      p.vid.srcObject = null;
      p.vid.className = 'hidden';
      p.img.onload = null; p.img.onerror = null;
      p.shownPath = '__reset__';
    }
    save(id, { live_until: null, rtc_offer: null });
    if (camById[id]) { updateCard(camById[id]); }
    if (msg) { $('err').textContent = msg; }
  }

  function showWaiting(p, text) {
    p.img.className = 'hidden';
    p.vid.className = 'hidden';
    p.empty.textContent = text;
    p.empty.className = 'empty';
  }

  function startLive(id) {
    var p = cards[id];
    var l = { pc: null, keep: null, poll: null, timer: null, fallbackTimer: null, maxTimer: null, url: null, connected: false, mode: '' };
    lives[id] = l;
    $('err').textContent = '';
    showWaiting(p, 'Connecting live video (the camera checks in every few seconds)...');
    updateCard(camById[id]);
    l.maxTimer = setTimeout(function () {
      stopLive(id, 'Live view stopped after ' + (LIVE_MAX_MS / 60000) + ' minutes.');
    }, LIVE_MAX_MS);
    if (window.RTCPeerConnection) { startRtc(id, l); } else { startFrames(id, l); }
  }

  function startRtc(id, l) {
    var p = cards[id];
    var rid = 'r' + Date.now() + Math.random().toString(36).slice(2, 8);
    var pc = new RTCPeerConnection(ICE);
    l.pc = pc;
    l.mode = 'rtc';
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.ontrack = function (e) {
      p.vid.srcObject = e.streams[0];
      p.vid.className = '';
      p.img.className = 'hidden';
      p.empty.className = 'hidden';
      var pr = p.vid.play();
      if (pr && pr.catch) { pr.catch(function () {}); }
    };
    pc.oniceconnectionstatechange = function () {
      var st = pc.iceConnectionState;
      if (st === 'connected' || st === 'completed') { l.connected = true; clearTimeout(l.fallbackTimer); }
      if ((st === 'failed' || st === 'closed') && lives[id] === l && l.mode === 'rtc') {
        fallback(id, l, 'Direct video failed, using pictures instead.');
      }
    };
    l.fallbackTimer = setTimeout(function () {
      if (lives[id] === l && !l.connected) {
        fallback(id, l, 'Direct video did not connect, using pictures instead.');
      }
    }, RTC_WAIT_MS);

    pc.createOffer().then(function (o) { return pc.setLocalDescription(o); })
      .then(function () { return waitIce(pc); })
      .then(function () {
        return save(id, { rtc_offer: JSON.stringify({ id: rid, sdp: pc.localDescription.sdp }), rtc_answer: null });
      }).then(function () {
        var answered = false;
        l.poll = setInterval(function () {
          if (answered || lives[id] !== l) { return; }
          sb.getRtcAnswer(id).then(function (raw) {
            if (!raw || answered) { return; }
            var a;
            try { a = JSON.parse(raw); } catch (e) { return; }
            if (a.id !== rid) { return; }
            answered = true;
            clearInterval(l.poll);
            pc.setRemoteDescription({ type: 'answer', sdp: a.sdp }).catch(function () {
              fallback(id, l, 'Direct video failed, using pictures instead.');
            });
          }).catch(function () {});
        }, 1000);
      }).catch(function () { fallback(id, l, 'Direct video failed, using pictures instead.'); });
  }

  function fallback(id, l, msg) {
    if (lives[id] !== l || l.mode !== 'rtc') { return; }
    clearInterval(l.poll);
    clearTimeout(l.fallbackTimer);
    if (l.pc) { try { l.pc.close(); } catch (e) {} l.pc = null; }
    var p = cards[id];
    p.vid.srcObject = null;
    save(id, { rtc_offer: null });
    showWaiting(p, msg);
    startFrames(id, l);
  }

  function startFrames(id, l) {
    var p = cards[id];
    var path = 'live/' + id + '.jpg';
    l.mode = 'frames';
    l.url = null;
    sb.deleteObject(path).catch(function () {});       // drop a stale frame from an earlier session

    function keepAlive() { save(id, { live_until: new Date(Date.now() + 45000).toISOString() }); }
    keepAlive();
    l.keep = setInterval(keepAlive, 20000);

    function tick() {
      if (lives[id] !== l) { return; }
      if (!l.url) {
        sb.signPaths([path]).then(function (map) {
          l.url = map[path] || null;
          l.timer = setTimeout(tick, l.url ? 0 : 1000);
        }).catch(function () { l.timer = setTimeout(tick, 2000); });
        return;
      }
      p.img.onload = function () {
        p.img.className = '';
        p.empty.className = 'hidden';
        l.timer = setTimeout(tick, LIVE_FRAME_MS);
      };
      p.img.onerror = function () { l.url = null; l.timer = setTimeout(tick, 1000); };
      p.img.src = l.url + (l.url.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();
    }
    tick();
  }

  // ---------- camera settings modal ----------
  function slider(parent, label, min, max, value, fmt, onSave) {
    var wrap = h('div', 'setting');
    var lab = h('label');
    var inp = document.createElement('input');
    inp.type = 'range'; inp.min = min; inp.max = max; inp.value = value;
    function refresh() { lab.textContent = label + ': ' + fmt(Number(inp.value)); }
    inp.oninput = refresh;
    inp.onchange = function () { onSave(Number(inp.value)); };
    wrap.appendChild(lab); wrap.appendChild(inp);
    parent.appendChild(wrap);
    refresh();
  }

  function openSettings(id) {
    var c = camById[id];
    var body = h('div');

    var arm = h('button');
    arm.onclick = function () { save(id, { armed: !camById[id].armed }); update(camById[id]); };
    body.appendChild(arm);

    var lens = h('div', 'setting');
    lens.appendChild(h('label', '', 'Lens'));
    var sel = document.createElement('select');
    [['environment', 'Back camera'], ['user', 'Front (selfie) camera']].forEach(function (o) {
      var op = document.createElement('option');
      op.value = o[0]; op.textContent = o[1];
      sel.appendChild(op);
    });
    sel.value = c.facing || 'environment';
    sel.onchange = function () { save(id, { facing: sel.value }); };
    lens.appendChild(sel);
    lens.appendChild(h('div', 'hint', 'The camera switches lens within a few seconds. Live video reconnects after the switch.'));
    body.appendChild(lens);

    slider(body, 'Sensitivity', 1, 100, c.sensitivity,
      function (v) { return 'alert at ' + (v / 20).toFixed(2) + '% of the image changing (lower = more sensitive)'; },
      function (v) { save(id, { sensitivity: v }); });
    slider(body, 'Repeat the alert while movement continues', 5, 600, c.cooldown_s,
      function (v) { return 'every ' + v + ' s (the first alert comes at once, nothing is sent after the movement stops)'; },
      function (v) { save(id, { cooldown_s: v }); });
    slider(body, 'Scene adapts after', 10, 300, c.adapt_s,
      function (v) { return 'about ' + v + ' s (a moved car or object stops counting as motion)'; },
      function (v) { save(id, { adapt_s: v }); });

    var lw = h('div', 'setting');
    lw.appendChild(h('label', '', 'Change since the last frame (white mark = alert threshold, updates every few seconds)'));
    var bar = h('div', 'bar2'); var meter = h('div', 'meter');
    bar.appendChild(meter); bar.appendChild(h('div', 'mark'));
    lw.appendChild(bar);
    body.appendChild(lw);

    var tw = h('div', 'setting');
    tw.appendChild(h('label', '', 'Alert topic for the ntfy app (text-only push, optional)'));
    var topic = document.createElement('input');
    topic.type = 'text'; topic.value = c.ntfy_topic || ''; topic.placeholder = 'e.g. garage-k3x9q2';
    topic.onchange = function () {
      sb.updateCamera(id, { ntfy_topic: topic.value.trim() || null })
        .catch(function () { showErr(new Error('Topic: 6-64 letters, digits, - or _')); });
    };
    tw.appendChild(topic);
    var gen = h('button', 'grey', 'Generate random topic');
    gen.onclick = function () {
      var chars = 'abcdefghijkmnpqrstuvwxyz23456789', s = 'garage-';
      for (var i = 0; i < 10; i++) { s += chars.charAt(Math.floor(Math.random() * chars.length)); }
      topic.value = s;
      topic.onchange();
    };
    tw.appendChild(gen);
    body.appendChild(tw);

    var row = h('div', 'row');
    var snap = h('button', 'grey', 'Take photo now');
    snap.onclick = function () { save(id, { snapshot_requested: true }); update(camById[id]); };
    var rename = h('button', 'grey', 'Rename');
    rename.onclick = function () {
      var n = prompt('Camera name', camById[id].name);
      if (n && n.trim()) { save(id, { name: n.trim().slice(0, 40) }); updateCard(camById[id]); }
    };
    var del = h('button', 'danger', 'Remove camera');
    del.onclick = function () {
      if (!confirm('Remove camera "' + camById[id].name + '"? Its code stops working and its photos are deleted.')) { return; }
      sb.deleteCamera(id).then(function () { closeModal(); loadCams(); loadEvents(); }).catch(showErr);
    };
    row.appendChild(snap); row.appendChild(rename); row.appendChild(del);
    body.appendChild(row);

    function update(cam) {
      if (!cam) { return; }
      arm.textContent = cam.armed ? 'Armed - tap to disarm' : 'Not armed - tap to arm';
      arm.className = cam.armed ? '' : 'grey';
      var level = isOnline(cam) && cam.motion_now != null ? Number(cam.motion_now) : 0;
      meter.style.width = Math.min(100, level / ((cam.sensitivity / 20) * 3) * 100) + '%';
      snap.textContent = cam.snapshot_requested ? 'Photo requested...' : 'Take photo now';
      snap.disabled = !!cam.snapshot_requested;
    }
    update(c);
    openModal(c.name + ' - settings', body, { id: id, update: update });
  }

  // ---------- add camera / invite ----------
  function codeBlock(body, code, note) {
    body.appendChild(h('div', 'code', code));
    body.appendChild(h('div', 'hint', note));
  }

  $('addCamBtn').onclick = function () {
    var body = h('div');
    body.appendChild(h('div', 'hint', 'Give the camera a name. You get a secret code to enter once on the camera phone.'));
    var name = document.createElement('input');
    name.type = 'text'; name.placeholder = 'Name, e.g. Garage';
    var go = h('button', '', 'Create camera');
    var out = h('div');
    go.onclick = function () {
      go.disabled = true;
      sb.rpc('create_camera', { p_name: name.value }).then(function (code) {
        body.innerHTML = '';
        codeBlock(body, code, 'Enter this code on the camera phone at .../demo/camera.html. It is shown only once, so copy it now.');
        loadCams();
      }).catch(function (e) { go.disabled = false; out.textContent = e.message; });
    };
    body.appendChild(name); body.appendChild(go); body.appendChild(out);
    openModal('Add a camera', body);
  };

  $('inviteBtn').onclick = function () {
    var body = h('div');
    body.appendChild(h('div', 'hint', 'The person will be able to see all cameras and photos. The code works once and is valid for 7 days.'));
    var go = h('button', '', 'Create invite code');
    var out = h('div');
    go.onclick = function () {
      go.disabled = true;
      sb.rpc('create_invite', { p_role: 'viewer' }).then(function (code) {
        body.innerHTML = '';
        codeBlock(body, code, 'They open this page, create an account and enter the code.');
      }).catch(function (e) { go.disabled = false; out.textContent = e.message; });
    };
    body.appendChild(go); body.appendChild(out);
    openModal('Invite someone', body);
  };

  // ---------- login / start ----------
  var polling = null;

  function ready() {
    $('who').textContent = sb.email();
    show(true);
    loadCams().then(loadEvents);
    clearInterval(polling);
    var n = 0;
    polling = setInterval(function () {
      if (document.hidden) { return; }
      n++;
      loadCams();
      if (n % 4 === 0) { loadEvents(); }       // photos every ~20 s, camera status every 5 s
    }, 5000);
  }

  var auth = GarageAuth.init({ sb: sb, el: $('authBox'), role: 'viewer', onReady: ready });

  $('logoutBtn').onclick = function () {
    Object.keys(lives).forEach(function (id) { stopLive(id); });
    sb.logout();
    clearInterval(polling);
    closeModal();
    show(false);
    auth.show();
  };

  window.addEventListener('beforeunload', function () {
    Object.keys(lives).forEach(function (id) { save(id, { live_until: null }); });
  });

  show(false);
  auth.start();
})();
</script>
</body>
</html>
