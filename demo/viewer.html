<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garage viewer</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #111; color: #eee; }
  main { max-width: 720px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 20px; margin: 4px 0 10px; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; margin-bottom: 8px; }
  button { padding: 10px 14px; font-size: 15px; border: 0; border-radius: 4px; background: #2d7ff9; color: #fff; margin-right: 6px; }
  button.grey { background: #555; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; color: #aaa; }
  .ev { background: #1c1c1c; border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
  .ev img { width: 100%; display: block; background: #000; min-height: 80px; }
  .ev .meta { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; font-size: 14px; }
  .err { color: #e74c3c; font-size: 14px; min-height: 18px; }
  .hidden { display: none; }
  .hint { font-size: 12px; color: #888; margin: 6px 0; }
  .invite { background: #1c1c1c; border-radius: 6px; padding: 8px 10px; margin-bottom: 12px; font-size: 14px; }
  .invite select { width: 100%; padding: 8px; font-size: 15px; margin: 8px 0; }
  .invite .code { font-size: 22px; letter-spacing: 2px; color: #eee; }
</style>
</head>
<body>
<main>
  <h1>Garage viewer</h1>

  <section id="authBox" class="hidden"></section>

  <section id="app" class="hidden">
    <div class="bar"><span id="who"></span><span><button class="grey" id="refreshBtn">Refresh</button><button class="grey" id="logoutBtn">Log out</button></span></div>
    <div class="err" id="err"></div>
    <details class="invite">
      <summary>Cameras</summary>
      <div id="camList" class="hint"></div>
      <input id="camName" type="text" placeholder="Name, e.g. Garage" style="width:100%;box-sizing:border-box;padding:8px;font-size:15px;margin:8px 0">
      <button id="camBtn">Add camera</button>
      <div id="camOut" class="hint"></div>
    </details>
    <details class="invite">
      <summary>Invite a family member</summary>
      <div class="hint">They will be able to see all photos.</div>
      <button id="inviteBtn">Create invite code</button>
      <div id="inviteOut" class="hint"></div>
    </details>
    <div id="list"></div>
  </section>
</main>
<script src="config.js"></script>
<script src="sb.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  var sb = makeSb('garage_viewer_session');
  var $ = function (id) { return document.getElementById(id); };
  var timer = null;

  function show(loggedIn) {
    $('authBox').className = loggedIn ? 'hidden' : '';
    $('app').className = loggedIn ? '' : 'hidden';
  }

  function render(events, urls) {
    var list = $('list');
    list.innerHTML = '';
    if (!events.length) { list.textContent = 'No events yet.'; return; }
    events.forEach(function (e) {
      var box = document.createElement('div');
      box.className = 'ev';
      var img = document.createElement('img');
      img.src = urls[e.photo_path] || '';
      img.alt = 'photo';
      var meta = document.createElement('div');
      meta.className = 'meta';
      var when = document.createElement('span');
      when.textContent = new Date(e.created_at).toLocaleString() + (e.kind === 'test' ? ' (test)' : '');
      var del = document.createElement('button');
      del.className = 'grey';
      del.textContent = 'Delete';
      del.onclick = function () {
        if (!confirm('Delete this photo?')) { return; }
        sb.deleteEvent(e.id, e.photo_path).then(load).catch(showErr);
      };
      meta.appendChild(when);
      meta.appendChild(del);
      box.appendChild(img);
      box.appendChild(meta);
      list.appendChild(box);
    });
  }

  function showErr(e) { $('err').textContent = e.message; if (!sb.loggedIn()) { show(false); auth.show(); } }

  function load() {
    $('err').textContent = '';
    return sb.listEvents(50).then(function (events) {
      return sb.signPaths(events.map(function (e) { return e.photo_path; })).then(function (urls) {
        render(events, urls);
      });
    }).catch(showErr);
  }

  function ready() {
    $('who').textContent = sb.email();
    show(true);
    load();
    loadCameras();
    clearInterval(timer);
    timer = setInterval(load, 20000);
  }

  var auth = GarageAuth.init({ sb: sb, el: $('authBox'), role: 'viewer', onReady: ready });

  $('refreshBtn').onclick = load;
  $('logoutBtn').onclick = function () {
    sb.logout();
    clearInterval(timer);
    show(false);
    auth.show();
  };

  $('inviteBtn').onclick = function () {
    var out = $('inviteOut');
    out.textContent = 'Creating...';
    sb.rpc('create_invite', { p_role: 'viewer' }).then(function (code) {
      out.innerHTML = '';
      var c = document.createElement('div');
      c.className = 'code';
      c.textContent = code;
      out.appendChild(c);
      out.appendChild(document.createTextNode('One use, valid for 7 days. The person opens this page, creates an account and enters the code.'));
    }).catch(function (e) { out.textContent = e.message; });
  };

  function loadCameras() {
    sb.listCameras().then(function (cams) {
      var box = $('camList');
      box.innerHTML = '';
      if (!cams.length) { box.textContent = 'No cameras yet.'; return; }
      cams.forEach(function (c) {
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin:6px 0';
        var info = document.createElement('span');
        info.textContent = c.name + ' - ' + (c.last_seen ? 'last photo ' + new Date(c.last_seen).toLocaleString() : 'no photo yet');
        var del = document.createElement('button');
        del.className = 'grey';
        del.textContent = 'Remove';
        del.onclick = function () {
          if (!confirm('Remove camera "' + c.name + '"? Its code stops working and its photos are deleted from the list.')) { return; }
          sb.deleteCamera(c.id).then(function () { loadCameras(); load(); }).catch(showErr);
        };
        row.appendChild(info);
        row.appendChild(del);
        box.appendChild(row);
      });
    }).catch(showErr);
  }

  $('camBtn').onclick = function () {
    var out = $('camOut');
    out.textContent = 'Creating...';
    sb.rpc('create_camera', { p_name: $('camName').value }).then(function (code) {
      out.innerHTML = '';
      var c = document.createElement('div');
      c.className = 'code';
      c.textContent = code;
      out.appendChild(c);
      out.appendChild(document.createTextNode('Enter this code on the camera phone. It is shown only once, so copy it now.'));
      $('camName').value = '';
      loadCameras();
    }).catch(function (e) { out.textContent = e.message; });
  };

  show(false);
  auth.start();
})();
</script>
</body>
</html>
